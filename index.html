<title>StudentHub</title>
<style>
:root{--bg:#000;--s1:#0b0b0b;--s2:#151515;--s3:#1e1e1e;--line:#242424;--fg:#ececec;--mut:#8e8e8e;--acc:#d97757;--ok:#4ade80;--bad:#f87171;--warn:#fbbf24;--serif:ui-serif,Georgia,"Times New Roman",serif;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}

.ico{flex:none;display:block}
.mut{color:var(--mut)}.bad{color:var(--bad)}

/* shell */
.app{display:flex;height:100%;overflow:hidden}
.side{width:272px;flex:none;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:14px 10px 10px;gap:6px;background:var(--bg);z-index:40}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--serif);font-size:21px;padding:2px 10px 10px;letter-spacing:-.01em}
.brand i{color:var(--acc);font-style:normal;font-size:22px}

.nav{display:flex;flex-direction:column;gap:2px;margin-top:6px}

.rec{flex:1;overflow-y:auto;margin-top:6px;min-height:0}
.rec h6{margin:10px 12px 6px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);font-weight:600}

.me:hover b{color:var(--acc)}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--acc);color:#000;display:grid;place-items:center;font-weight:700;flex:none;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.me .t{min-width:0;flex:1}.me b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:color .15s}

.main{flex:1;min-width:0;display:flex;flex-direction:column;height:100%}
.top{display:none;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--bg)}
.top .brand{padding:0;font-size:18px;flex:1}
.ib{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--fg);transition:background .15s}
.ib:hover{background:var(--s2)}.ib.sm{width:30px;height:30px;color:var(--mut)}.ib.sm:hover{color:var(--bad)}
.page{flex:1;min-height:0;overflow-y:auto}
.page.chatp{overflow:hidden}
.wrap{max-width:780px;margin:0 auto;padding:30px 20px 60px}
h1{font-family:var(--serif);font-weight:500;font-size:30px;letter-spacing:-.02em;margin:0;line-height:1.2}
h2{font-size:17px;margin:0 0 10px}
.sub{color:var(--mut);margin:4px 0 20px}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:35}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 16px;border-radius:12px;border:1px solid var(--line);background:var(--s2);font-weight:600;font-size:14px;transition:background .15s,transform .1s;white-space:nowrap}
.btn:hover{background:var(--s3)}.btn:active{transform:scale(.98)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#000}.btn.pri:hover{filter:brightness(1.08);background:var(--acc)}
.btn.dng{color:var(--bad)}
.btn.wide{width:100%}.btn.lg{padding:13px 20px;font-size:15px;border-radius:14px}
input[type=text],input[type=search],input[type=password],input[type=number],input[type=time],input[type=datetime-local],select,textarea{width:100%;padding:10px 13px;border-radius:12px;border:1px solid var(--line);background:var(--s1);outline:none;transition:border-color .15s}
input:focus,select:focus,textarea:focus{border-color:#4a4a4a}
select option{background:#111}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--mut);font-weight:500}
.fg{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}.fg .full{grid-column:1/-1}
.row{display:flex;align-items:center;gap:10px;min-width:0}.row.wrap{flex-wrap:wrap}.sp{flex:1}
.card{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:18px}
.pill{display:inline-flex;align-items:center;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:600;background:var(--s3);color:var(--mut)}
.pill.acc{background:rgba(217,119,87,.16);color:var(--acc)}.pill.ok{background:rgba(74,222,128,.14);color:var(--ok)}.pill.bd{background:rgba(248,113,113,.14);color:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 14px;border-radius:20px;border:1px solid var(--line);background:var(--s1);color:var(--mut);font-size:14px;transition:all .15s}
.chip:hover{color:var(--fg);border-color:#3a3a3a;background:var(--s2)}
.chip.on{background:var(--acc);color:#000;border-color:var(--acc);font-weight:600}
.empty{text-align:center;color:var(--mut);padding:48px 16px}
.empty b{display:block;color:var(--fg);font-size:16px;margin-bottom:4px}

/* chat */
.chat{display:flex;flex-direction:column;height:100%}
.msgs{flex:1;overflow-y:auto;padding:20px 16px}
.mi{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.m{display:flex;gap:12px;min-width:0}
.m.u{justify-content:flex-end}
.bub{background:var(--s2);border-radius:18px;padding:10px 16px;max-width:85%;white-space:pre-wrap;overflow-wrap:anywhere}
.av{color:var(--acc);font-size:20px;line-height:1.5;flex:none;width:22px;text-align:center}
.body{min-width:0;flex:1}
.macts{display:flex;gap:4px;margin-top:6px;opacity:.0;transition:opacity .15s}.m:hover .macts,.m:last-child .macts{opacity:1}
.macts button{font-size:12.5px;color:var(--mut);padding:4px 9px;border-radius:8px}.macts button:hover{background:var(--s2);color:var(--fg)}
.prose{overflow-wrap:anywhere}
.prose>*+*{margin-top:10px}.prose p{margin:0}.prose h2,.prose h3,.prose h4{font-family:var(--serif);font-weight:500;margin:16px 0 4px}
.prose ul,.prose ol{padding-left:22px;margin:6px 0}.prose li+li{margin-top:3px}
.prose code{background:var(--s3);padding:1px 6px;border-radius:6px;font-size:.9em}
.prose pre{background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:12px;overflow-x:auto}.prose pre code{background:none;padding:0}
.hero{max-width:760px;margin:0 auto;padding:7vh 0 20px;text-align:center}
.hero .star{color:var(--acc);font-size:34px;line-height:1}
.hero h1{margin:10px 0 24px;font-size:clamp(28px,5vw,38px)}
.glance{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;text-align:left;margin-bottom:22px}
.glance button{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-align:left;transition:background .15s}
.glance button:hover{background:var(--s2)}
.glance small{display:block;color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.glance b{font-weight:600}
.hero .chips{justify-content:center}
.cwrap{padding:0 16px 12px}
.composer{max-width:760px;margin:0 auto;display:flex;align-items:flex-end;gap:8px;background:var(--s2);border:1px solid var(--line);border-radius:24px;padding:8px 8px 8px 18px}

.composer textarea{border:0;background:none;padding:8px 0;resize:none;max-height:180px;min-height:24px;border-radius:0}
.dia{background:#fff;border-radius:14px;padding:8px;margin:10px 0;max-width:640px}.dia img{width:100%;height:auto;display:block}.dsave{display:inline-block;margin:4px 4px 0;font-size:13px;color:#555;text-decoration:underline}
.bub img{max-width:100%;max-height:260px;border-radius:12px;display:block;margin:0 0 6px}
.cprev{max-width:760px;margin:0 auto 8px;display:none;position:relative;width:fit-content}
.cprev.on{display:block}.cprev img{height:72px;border-radius:12px;display:block;border:1px solid var(--line)}
.cprev button{position:absolute;top:-8px;right:-8px;width:24px;height:24px;border-radius:50%;background:var(--s2);border:1px solid var(--line);display:grid;place-items:center}
.send{width:38px;height:38px;border-radius:50%;background:var(--acc);color:#000;display:grid;place-items:center;flex:none}
.send:disabled{opacity:.35}
.fine{max-width:760px;margin:8px auto 0;text-align:center;font-size:12px;color:#5f5f5f}
.dots{display:inline-flex;gap:5px;padding:8px 0}.dots i{width:7px;height:7px;border-radius:50%;background:var(--acc);animation:db 1.2s infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes db{0%,80%,100%{opacity:.3;transform:scale(.7)}40%{opacity:1;transform:scale(1)}}

/* list rows */
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.rb{flex:1;min-width:0}.rb b{display:block;font-weight:600;overflow-wrap:anywhere}.rb small{color:var(--mut)}
.li.done .rb b{text-decoration:line-through;color:var(--mut)}
.chk{width:24px;height:24px;border-radius:8px;border:2px solid #3a3a3a;display:grid;place-items:center;color:transparent;flex:none;transition:all .2s}
.chk:hover{border-color:var(--acc)}.chk.on{background:var(--ok);border-color:var(--ok);color:#000}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:16px;padding-bottom:2px}
.tabs button{flex:1;min-width:58px;padding:9px 6px;border-radius:12px;border:1px solid var(--line);color:var(--mut);font-weight:600;font-size:13.5px}
.tabs button.on{background:var(--acc);color:#000;border-color:var(--acc)}
.tabs button.today:not(.on){border-color:#555;color:var(--fg)}
.cls{display:grid;grid-template-columns:76px 1fr auto;gap:12px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--s1);margin-bottom:10px}
.cls .tm{font-size:12.5px;color:var(--mut);line-height:1.4}.cls .tm b{display:block;color:var(--fg);font-size:14px}
.cls.now{border-color:var(--acc)}

/* notes */
.split{display:grid;grid-template-columns:300px 1fr;height:100%}
.lcol{border-right:1px solid var(--line);overflow-y:auto;padding:20px 12px}
.ecol{overflow-y:auto;padding:24px 28px;min-width:0}
.ni{display:block;width:100%;text-align:left;padding:10px 12px;border-radius:12px;margin-bottom:2px}
.ni:hover,.ni.on{background:var(--s2)}.ni b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ni small{color:var(--mut);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ntitle{border:0!important;background:none!important;font-family:var(--serif);font-size:28px;padding:0!important}
.nbody{border:0!important;background:none!important;padding:0!important;min-height:55vh;resize:none;line-height:1.7;font-size:16px}

/* timer */
.tw{display:flex;flex-direction:column;align-items:center;gap:20px;padding:10px 0 20px}
.ring{position:relative;width:min(300px,78vw);aspect-ratio:1}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring b{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:clamp(42px,12vw,60px);font-weight:500;letter-spacing:-.03em}
.ring small{color:var(--mut);text-transform:uppercase;letter-spacing:.14em;font-size:12px;font-weight:600}
.bars{display:flex;align-items:flex-end;gap:8px;height:110px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:5px}
.bars i{display:block;width:100%;max-width:34px;border-radius:7px 7px 3px 3px;background:#333;min-height:3px}.bars .t i{background:var(--acc)}

/* quiz */
.qbar{height:6px;border-radius:6px;background:var(--s3);overflow:hidden}.qbar i{display:block;height:100%;background:var(--acc);border-radius:6px;transition:width .3s}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 14px;border-radius:14px;border:1px solid var(--line);background:var(--s1);transition:background .15s,border-color .15s}
.opt:not(:disabled):hover{background:var(--s2);border-color:#3a3a3a}
.opt .ol{width:28px;height:28px;border-radius:50%;background:var(--s3);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.opt.ok{border-color:var(--ok);background:rgba(74,222,128,.1)}.opt.ok .ol{background:var(--ok);color:#000}
.opt.no{border-color:var(--bad);background:rgba(248,113,113,.1)}.opt.no .ol{background:var(--bad);color:#000}
.opt.dim{opacity:.5}
.fb{margin-top:16px;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:var(--s1);animation:pop .25s}
.fb.ok{border-color:rgba(74,222,128,.5)}.fb.ok>b{color:var(--ok)}.fb.no{border-color:rgba(248,113,113,.5)}.fb.no>b{color:var(--bad)}
.fb>b{display:block;font-size:16px;margin-bottom:4px}
/* modal + toast */
.mw{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(4px)}
.modal{width:min(480px,100%);max-height:92dvh;overflow-y:auto;background:var(--s1);border:1px solid #2c2c2c;border-radius:20px;padding:20px;animation:pop .2s}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}}
.modal h3{margin:0 0 14px;font-family:var(--serif);font-weight:500;font-size:22px}
.mf{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;flex-wrap:wrap}
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom));z-index:120;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:100%}
.toast{background:#f2f2f2;color:#000;padding:10px 16px;border-radius:12px;font-weight:500;font-size:14px;max-width:90%;box-shadow:0 8px 30px rgba(0,0,0,.5);animation:pop .25s}

/* login */
.login{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;padding:24px;z-index:150;overflow-y:auto}
.login .in{width:min(380px,100%);text-align:center;display:flex;flex-direction:column;gap:12px}
.login .star{color:var(--acc);font-size:44px;line-height:1}

.gbtn{background:#fff;color:#111;border-color:#fff;gap:12px}.gbtn:hover{background:#eee}
.fine2{font-size:12px;color:#666;margin-top:6px}
.login::before,.login::after{content:"";position:absolute;border-radius:50%;filter:blur(70px);opacity:.28;pointer-events:none;animation:drift 14s ease-in-out infinite alternate}
.login::before{width:340px;height:340px;background:var(--acc);top:-90px;left:-80px}
.login::after{width:300px;height:300px;background:#6d5dfc;bottom:-90px;right:-80px;animation-delay:-6s}
@keyframes drift{to{transform:translate(70px,50px) scale(1.2)}}
.login .in{position:relative;z-index:1}
.login .in>*{opacity:0;animation:rise .6s cubic-bezier(.2,.8,.2,1) forwards}
.login .in>*:nth-child(1){animation-delay:.05s}.login .in>*:nth-child(2){animation-delay:.15s}.login .in>*:nth-child(3){animation-delay:.25s}
.login .in>*:nth-child(4){animation-delay:.35s}.login .in>*:nth-child(5){animation-delay:.45s}.login .in>*:nth-child(6){animation-delay:.55s}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.login .star{animation:rise .6s forwards,spin 8s linear 1s infinite!important;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.credit{font-size:12.5px;color:#777;line-height:1.5}.credit b{color:var(--acc);font-weight:600}

.set{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 0;flex-wrap:wrap}.set+.set{border-top:1px solid var(--line)}
.set .l b{display:block;font-weight:600}.set .l small{color:var(--mut);font-size:13px}

.mnav2{display:none}
@media (max-width:860px){
  .mnav2{display:grid}
  .side{position:fixed;inset:0 auto 0 0;width:84vw;max-width:320px;transform:translateX(-104%);transition:transform .25s;padding-top:14px}
  .side.open{transform:none}
  .top{display:flex}
  .split{grid-template-columns:1fr}
  .split.editing .lcol{display:none}.split:not(.editing) .ecol{display:none}
  .ecol{padding:18px 16px}
  .wrap{padding:22px 16px 60px}
  .mw{align-items:flex-end;padding:0}.modal{border-radius:20px 20px 0 0;width:100%}
  .cls{grid-template-columns:64px 1fr auto}
  .macts{opacity:1}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

function svgH(raw){
  let v=String(raw||'');const i=v.indexOf('<svg'),j=v.lastIndexOf('</svg>');
  if(i<0||j<0)return '<p class="mut">The diagram was cut off. Ask me to draw it again.</p>';
  v=v.slice(i,j+6)
    .replace(/<script[\s\S]*?<\/script>/gi,'').replace(/<foreignObject[\s\S]*?<\/foreignObject>/gi,'')
    .replace(/<(image|iframe|object|embed|use)\b[^>]*>/gi,'')
    .replace(/\s(on\w+|style)\s*=\s*("[^"]*"|'[^']*')/gi,m=>/^\s+style/i.test(m)&&!/url\(|expression|javascript/i.test(m)?m:'')
    .replace(/(xlink:)?href\s*=\s*("[^"]*"|'[^']*')/gi,'');
  if(!/xmlns=/.test(v.slice(0,300)))v=v.replace('<svg','<svg xmlns="http://www.w3.org/2000/svg"');
  const u='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(v);
  return `<div class="dia"><img alt="Diagram" src="${u}"><a class="dsave" download="studenthub-diagram.svg" href="${u}">Save diagram</a></div>`;
}
function md(src){
  const lines=String(src||'').replace(/\r/g,'').split('\n');let out='',list=null,para=[],inCode=false,code=[],lang='';
  const inl=s=>esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<em>$2</em>');
  const fp=()=>{if(para.length){out+='<p>'+para.map(inl).join('<br>')+'</p>';para=[]}};
  const cl=()=>{if(list){out+='</'+list+'>';list=null}};
  for(const l of lines){
    let m;
    if(/^```/.test(l)){if(inCode){out+=lang==='svg'?svgH(code.join('\n')):'<pre><code>'+esc(code.join('\n'))+'</code></pre>';code=[];inCode=false;lang=''}else{fp();cl();inCode=true;lang=((l.match(/^```\s*(\w*)/)||[])[1]||'').toLowerCase()}continue}
    if(inCode){code.push(l);continue}
    if(!l.trim()){fp();cl();continue}
    if((m=l.match(/^(#{1,4})\s+(.*)/))){fp();cl();const n=Math.min(4,m[1].length+1);out+=`<h${n}>${inl(m[2])}</h${n}>`;continue}
    if((m=l.match(/^\s*[-*•]\s+(.*)/))){fp();if(list!=='ul'){cl();out+='<ul>';list='ul'}out+='<li>'+inl(m[1])+'</li>';continue}
    if((m=l.match(/^\s*(\d+)[.)]\s+(.*)/))){fp();if(list!=='ol'){cl();out+='<ol>';list='ol'}out+='<li>'+inl(m[2])+'</li>';continue}
    cl();para.push(l);
  }
  if(inCode)out+=lang==='svg'?(code.join('\n').includes('</svg>')?svgH(code.join('\n')):'<p class="mut">Drawing diagram...</p>'):'<pre><code>'+esc(code.join('\n'))+'</code></pre>';
  fp();cl();return out;
}

  setTimeout(()=>{el.style.transition='opacity .3s';el.style.opacity='0';setTimeout(()=>el.remove(),320)},ms);
}

const SYS="You are StudentHub's study assistant, created by Wisdom of WisdomArk. Never mention any underlying AI model or company; if asked who made you, say you are StudentHub's assistant, built by Wisdom at WisdomArk. The student is in secondary school or university. Use simple, friendly language. Be accurate and say so when unsure. Format with short headings and bullet lists in Markdown. Never use tables or LaTeX; write maths in plain text like x^2, 3/4, sqrt(16). Give step-by-step working for maths. For practice questions, put the answers after the questions. Keep answers focused. When a diagram, chart, graph, flowchart, labelled figure or simple illustration would help, or the student asks for one, include it as ONE complete SVG inside a ```svg code block, then explain it briefly in text. SVG rules: viewBox 0 0 600 H with H at most 450 and no fixed width or height; first draw a white background rect; dark text (#111) with font-family sans-serif and font-size 14 or more; clear contrasting colors; short labels that do not overlap; no scripts, no external images or fonts; keep it simple and quick to draw. Never say you cannot draw.";
function turnsFrom(msgs){
  const t=[];
  msgs.filter(m=>!m.err).slice(-14).forEach(m=>{
    const r=m.r==='user'?'user':'assistant';
    if(t.length&&t[t.length-1].role===r)t[t.length-1].content+='\n\n'+m.t;else t.push({role:r,content:m.t});
  });
  while(t.length&&t[0].role!=='user')t.shift();
  return t;
}
async function askAI(msgs,onText,signal){
  const p=S.settings.provider,hasC=!!(window.claude&&window.claude.use),hasG=!!S.settings.geminiKey.trim();
  const which=p==='auto'?(hasC?'claude':hasG?'gemini':null):p;
  if(!which)throw{code:'noai'};
  const turns=turnsFrom(msgs);
  if(which==='claude'){
    if(!hasC)throw{code:'noclaude'};
    const sample=await window.claude.use('sample');
    if(!sample)throw{code:'noclaude'};
    const t=turns.map((x,i)=>i===0?{...x,content:SYS+'\n\nStudent:\n'+x.content}:x);
    const r=await sample(t,{cache:false,signal,onText:({text})=>onText(text)});
    return r.text;
  }
  if(!hasG)throw{code:'nokey'};
  const chosen=(S.settings.geminiModel||'gemini-flash-latest').trim();
  const models=[chosen,'gemini-flash-latest','gemini-flash-lite-latest','gemini-2.5-flash','gemini-2.5-flash-lite'].filter((m,k,a)=>a.indexOf(m)===k);
  const body=JSON.stringify({systemInstruction:{parts:[{text:SYS}]},contents:turns.map((x,k)=>{const parts=[{text:x.content}];const lm=msgs[msgs.length-1];if(k===turns.length-1&&x.role==='user'&&lm&&IM.get(lm)){parts.push({inlineData:{mimeType:'image/jpeg',data:IM.get(lm).full.split(',')[1]}})}return{role:x.role==='user'?'user':'model',parts}})});
  let res=null,lastStatus=0;
  outer:for(const m of models){
    for(let a=0;a<2;a++){
      if(signal&&signal.aborted)throw{name:'AbortError'};
      const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(m)+':generateContent',{method:'POST',signal,headers:{'Content-Type':'application/json','x-goog-api-key':S.settings.geminiKey.trim()},body});
      if(r.ok){res=r;break outer}
      lastStatus=r.status;
      if(r.status===400||r.status===401||r.status===403){if(m===chosen||r.status!==400)throw{code:'http',status:r.status};break}
      if(r.status===503||r.status===500){await new Promise(z=>setTimeout(z,1200));continue}
      break;
    }
  }
  if(!res)throw{code:'http',status:lastStatus||503};
  const j=await res.json();
  const txt=((j.candidates||[])[0]||{}).content;
  const out=txt&&txt.parts?txt.parts.map(p=>p.text||'').join(''):'';
  if(!out)throw{code:'empty'};
  return out;
}
function errText(e){
  const c=e&&e.code;
  if(c==='noai')return 'The AI assistant is not ready yet.\n\nOpen **Settings → AI assistant** and paste a free Gemini key from aistudio.google.com.';
  if(c==='nokey')return 'Add your Gemini key in **Settings → AI assistant** first.';
  if(c==='noclaude')return 'The built-in AI is not available here. Add a Gemini key in **Settings → AI assistant**.';
  if(c==='http'){
    if(e.status===429)return 'The free AI limit was reached for now. Wait a minute and try again.';
    if(e.status===400||e.status===403||e.status===401)return 'The AI key or model name was rejected. Check them in **Settings → AI assistant**.';
    return 'The AI service had a problem (error '+e.status+'). Try again in a moment.';
  }
  if(c==='empty')return 'The AI returned an empty answer. Try rephrasing your question.';
  return 'I could not reach the AI. Check your internet connection and try again.';
}

  paintMsgs(busy);setSendBtn();

  ci.addEventListener('input',fit);
  ci.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!matchMedia('(pointer:coarse)').matches){e.preventDefault();cf.requestSubmit()}});
  const cfile=$('#cfile'),cat=$('#cat');
  paintPrev();
  cat.addEventListener('click',()=>cfile.click());
  cfile.addEventListener('change',async()=>{const f=cfile.files&&cfile.files[0];cfile.value='';if(!f)return;try{PEND=await prepImg(f);paintPrev()}catch(_){toast('Could not read that image.')}});

let busy=false,ctl=null,PEND=null;
const IM=new WeakMap();
function prepImg(file){return new Promise((ok,no)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{try{const sc=(w,mx)=>{const k=Math.min(1,mx/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));c.getContext('2d').drawImage(im,0,0,c.width,c.height);return c.toDataURL('image/jpeg',w)};const r={full:sc(.82,1280),th:sc(.7,420)};URL.revokeObjectURL(u);ok(r)}catch(e){no(e)}};im.onerror=()=>{URL.revokeObjectURL(u);no(new Error('img'))};im.src=u})}
function paintPrev(){const p=$('#cprev');if(!p)return;if(PEND){p.className='cprev on';p.innerHTML=`<img src="${PEND.th}" alt="Selected photo"><button type="button" id="cprm" aria-label="Remove photo">${ico('x',14)}</button>`;$('#cprm').onclick=()=>{PEND=null;paintPrev()}}else{p.className='cprev';p.innerHTML=''}}
async function send(text){
  text=String(text||'').trim();if((!text&&!PEND)||busy)return;if(!text)text='Please help me with this photo.';const pic=PEND;PEND=null;paintPrev();
  let c=curChat();
  if(!c){c={id:uid(),title:text.slice(0,48),ts:Date.now(),msgs:[]};S.chats.unshift(c);CH=c.id}
  const um={r:'user',t:text};if(pic){um.img=1;IM.set(um,pic)}c.msgs.push(um);c.ts=Date.now();save();
  if(view!=='chat'){view='chat';location.hash='#chat'}
  busy=true;ctl=new AbortController();
  if(!$('#mi'))render();
  paintMsgs(true);setSendBtn();renderSide();
  const live=t=>{const p=$('#live .prose');if(p){p.innerHTML=md(t);const b=$('#msgs');if(b)b.scrollTop=b.scrollHeight}};
  try{c.msgs.push({r:'ai',t:await askAI(c.msgs,live,ctl.signal)})}
  catch(e){if(!(e&&(e.name==='AbortError'||e.code==='cancelled')))c.msgs.push({r:'ai',t:errText(e),err:true})}
  busy=false;ctl=null;save();
  if(view==='chat'&&CH===c.id){paintMsgs(false);setSendBtn()}
  renderSide();
}
function askAbout(text){CH=null;view='chat';if(location.hash!=='#chat')location.hash='#chat';else render();setTimeout(()=>send(text),60)}

function openClassModal(id){
  const c=S.classes.find(x=>x.id===id),o=c||{subject:'',room:'',day:TD,start:'08:00',end:'09:00'};
  openModal(c?'Edit class':'Add class',`<form id="clf"><div class="fg"><label class="f full">Subject<input type="text" name="subject" required maxlength="50" value="${esc(o.subject)}" placeholder="e.g. Mathematics"></label><label class="f">Starts<input type="time" name="start" required value="${o.start}"></label><label class="f">Ends<input type="time" name="end" required value="${o.end}"></label><label class="f full">Room or teacher (optional)<input type="text" name="room" maxlength="60" value="${esc(o.room)}"></label></div><div class="chips" style="margin-top:14px">${DAYS.map((d,i)=>`<label class="chip" style="cursor:pointer"><input type="checkbox" name="d" value="${i}" ${i===o.day?'checked':''} style="accent-color:#d97757"> ${d}</label>`).join('')}</div><div class="mf"><button class="btn" type="button" data-x="c">Cancel</button><button class="btn pri" type="submit">${c?'Save':'Add class'}</button></div></form>`,m=>{
    m.el.addEventListener('click',e=>{if(e.target.closest('[data-x=c]'))m.close()});
    $('#clf',m.el).addEventListener('submit',e=>{
      e.preventDefault();const fd=new FormData(e.target),days=fd.getAll('d').map(Number);
      const s=fd.get('start'),en=fd.get('end');
      if(!days.length){toast('Pick at least one day.');return}
      if(toMin(en)<=toMin(s)){toast('End time must be after the start time.');return}
      const base={subject:String(fd.get('subject')).trim(),room:String(fd.get('room')).trim(),start:s,end:en};
      if(c){Object.assign(c,base,{day:days[0]});days.slice(1).forEach(d=>S.classes.push({id:uid(),day:d,...base}))}
      else days.forEach(d=>S.classes.push({id:uid(),day:d,...base}));
      TD=days[0];save();m.close();render();toast(c?'Class updated':'Class added');
    });
  });
}

  let nextDone=false;
  const rows=list.map(c=>{
    const clash=list.some(o=>o!==c&&toMin(o.start)<toMin(c.end)&&toMin(c.start)<toMin(o.end));

  }).join('');

/* ---------- Study timer ---------- */
const TM={mode:'focus',rem:1500,end:0,run:false};
const tmTotal=()=>(TM.mode==='focus'?S.settings.focus:S.settings.brk)*60;
const minsOn=k=>S.sessions.filter(s=>s.date===k).reduce((a,s)=>a+s.mins,0);
let actx=null;
function chime(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();[660,880,1100].forEach((f,i)=>{const o=actx.createOscillator(),g=actx.createGain(),t=actx.currentTime+i*.22;o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.2,t+.03);g.gain.exponentialRampToValueAtTime(.0001,t+.4);o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+.45)})}catch(e){}}
function logSess(mins){if(mins<1)return;S.sessions.push({id:uid(),ts:Date.now(),date:dkey(),mins});if(S.sessions.length>1000)S.sessions.shift();save()}
function elapsed(){return tmTotal()-(TM.run?Math.max(0,Math.ceil((TM.end-Date.now())/1000)):TM.rem)}
function tmStart(){if(TM.run)return;try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();actx.resume()}catch(e){}TM.run=true;TM.end=Date.now()+TM.rem*1000;if(view==='timer')render()}
function tmPause(){if(!TM.run)return;TM.rem=Math.max(0,Math.ceil((TM.end-Date.now())/1000));TM.run=false;if(view==='timer')render()}
function tmReset(){const e=elapsed();if(TM.mode==='focus'&&e>=60){logSess(Math.floor(e/60));toast('Logged '+Math.floor(e/60)+' min of focus')}TM.run=false;TM.rem=tmTotal();if(view==='timer')render()}
function tmMode(m){TM.mode=m;TM.run=false;TM.rem=tmTotal();if(view==='timer')render()}
function tmDone(){
  TM.run=false;chime();
  if(TM.mode==='focus'){logSess(S.settings.focus);toast('Focus session complete. Take a break!');TM.mode='brk'}else{toast('Break over. Ready to focus?');TM.mode='focus'}
  TM.rem=tmTotal();if(view==='timer')render();
}
setInterval(()=>{
  if(!TM.run||!S)return;
  TM.rem=Math.max(0,Math.ceil((TM.end-Date.now())/1000));
  if(TM.rem<=0){tmDone();return}
  const t=$('#tt'),r=$('#tr');if(t)t.textContent=mmss(TM.rem);if(r)r.setAttribute('stroke-dashoffset',(2*Math.PI*110*TM.rem/tmTotal()).toFixed(1));
  document.title=mmss(TM.rem)+' · StudentHub';
},500);
function vTimer(){
  const C=2*Math.PI*110,T0=dkey(),week=[];
  for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);week.push({l:DAYS[dow(d)],k:dkey(d),m:minsOn(dkey(d))})}
  const mx=Math.max(60,...week.map(w=>w.m));
  document.title='StudentHub';
  return `<div class="wrap"><h1>Study timer</h1><p class="sub">Focus in short bursts. Rest properly.</p>
  <div class="tw"><div class="chips"><button class="chip ${TM.mode==='focus'?'on':''}" data-a="tmode" data-v="focus">Focus ${S.settings.focus}m</button><button class="chip ${TM.mode==='brk'?'on':''}" data-a="tmode" data-v="brk">Break ${S.settings.brk}m</button></div>
  <div class="ring"><svg viewBox="0 0 250 250"><circle cx="125" cy="125" r="110" fill="none" stroke="#222" stroke-width="9"/><circle id="tr" cx="125" cy="125" r="110" fill="none" stroke="#d97757" stroke-width="9" stroke-linecap="round" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${(C*TM.rem/tmTotal()).toFixed(1)}"/></svg><div class="c"><b id="tt">${mmss(TM.rem)}</b><small>${TM.mode==='focus'?'Focus':'Break'}</small></div></div>
  <div class="row" style="gap:14px"><button class="ib" data-a="treset" aria-label="Reset" style="border:1px solid var(--line);width:46px;height:46px;border-radius:50%">${ico('reset',20)}</button><button class="send" data-a="ttog" aria-label="${TM.run?'Pause':'Start'}" style="width:68px;height:68px">${ico(TM.run?'pause':'play',28)}</button></div></div>
  <div class="card"><div class="row" style="margin-bottom:12px"><h2 style="margin:0;flex:1">This week</h2><span class="pill acc">Today: ${minsOn(T0)} min</span></div><div class="bars">${week.map(w=>`<div class="${w.k===T0?'t':''}"><small>${w.m||''}</small><i style="height:${Math.max(3,w.m/mx*78)}%"></i><small>${w.l}</small></div>`).join('')}</div></div></div>`;
}

const EX={JAMB:'J',WAEC:'W',NECO:'N',Other:'O'};
const EXD={JAMB:'UTME practice',WAEC:'WASSCE practice',NECO:'SSCE practice','Other':'General and Post-UTME'};
const QZ={st:'setup',ex:'JAMB',sub:'All',n:10,qs:[],i:0,sel:null,score:0,wrong:[]};
const shuf=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
const qPool=()=>BANK.filter(q=>q[0].includes(EX[QZ.ex])&&(QZ.sub==='All'||q[1]===QZ.sub));
const qSubs=()=>[...new Set(BANK.filter(q=>q[0].includes(EX[QZ.ex])).map(q=>q[1]))];
function qStart(){
  const pool=qPool();if(!pool.length){toast('No questions for that choice yet.');return}
  QZ.qs=shuf(pool).slice(0,QZ.n).map(q=>{const o=shuf(q[3].map((t,i)=>({t,c:i===q[4]})));return{sub:q[1],q:q[2],o:o.map(x=>x.t),a:o.findIndex(x=>x.c),e:q[5]}});
  QZ.st='play';QZ.i=0;QZ.sel=null;QZ.score=0;QZ.wrong=[];render();
}
function vQuiz(){
  const L='ABCD';
  if(QZ.st==='play'){
    const q=QZ.qs[QZ.i],ans=QZ.sel!==null,last=QZ.i===QZ.qs.length-1;
    return `<div class="wrap"><div class="row" style="margin-bottom:14px"><button class="ib sm" data-a="qquit" aria-label="Quit quiz">${ico('x',20)}</button><span class="mut" style="flex:1">${esc(QZ.ex)} · ${esc(q.sub)}</span><span class="pill acc">${QZ.i+1} / ${QZ.qs.length}</span></div>
    <div class="qbar"><i style="width:${(QZ.i+(ans?1:0))/QZ.qs.length*100}%"></i></div>
    <h2 style="font-size:20px;line-height:1.4;margin:18px 0 16px;font-family:var(--serif);font-weight:500">${esc(q.q)}</h2>
    <div class="opts">${q.o.map((t,i)=>{let c='';if(ans){if(i===q.a)c='ok';else if(i===QZ.sel)c='no';else c='dim'}return `<button class="opt ${c}" data-a="qpick" data-i="${i}" ${ans?'disabled':''}><span class="ol">${L[i]}</span><span>${esc(t)}</span></button>`}).join('')}</div>
    ${ans?`<div class="fb ${QZ.sel===q.a?'ok':'no'}"><b>${QZ.sel===q.a?'Correct!':'Not quite.'}</b>${QZ.sel===q.a?'':`<div>The right answer is <strong>${L[q.a]}. ${esc(q.o[q.a])}</strong></div>`}<div class="mut" style="margin-top:6px"><strong style="color:var(--fg)">Why:</strong> ${esc(q.e)}</div></div><button class="btn pri lg wide" style="margin-top:14px" data-a="qnext">${last?'See my results':'Next question'}</button>`:''}</div>`;
  }
  if(QZ.st==='done'){
    const n=QZ.qs.length,pc=Math.round(QZ.score/n*100);
    const msg=pc>=80?'Excellent work!':pc>=60?'Good job. Keep going.':pc>=40?'Not bad. Review the answers below.':'Keep practising. Read each explanation below.';
    return `<div class="wrap"><div class="card" style="text-align:center;margin-bottom:18px"><div class="mut" style="font-size:13px;letter-spacing:.1em;text-transform:uppercase;font-weight:600">${esc(QZ.ex)} · ${esc(QZ.sub==='All'?'All subjects':QZ.sub)}</div><div style="font-family:var(--serif);font-size:56px;line-height:1.1;margin:8px 0;color:${pc>=60?'var(--ok)':'var(--acc)'}">${QZ.score}/${n}</div><div style="font-weight:600">${pc}% · ${msg}</div></div>
    <div class="row wrap" style="margin-bottom:22px"><button class="btn pri sp" data-a="qagain">Try again</button><button class="btn sp" data-a="qnew">New quiz</button></div>
    ${QZ.wrong.length?`<h2>Questions to review (${QZ.wrong.length})</h2>${QZ.wrong.map((w,k)=>`<div class="card" style="margin-bottom:12px"><div class="mut" style="font-size:12.5px">${esc(w.sub)}</div><div style="font-weight:600;margin:4px 0 8px">${esc(w.q)}</div><div class="bad">Your answer: ${esc(w.o[w.pick])}</div><div style="color:var(--ok)">Correct answer: ${esc(w.o[w.a])}</div><div class="mut" style="margin-top:8px"><strong style="color:var(--fg)">Why:</strong> ${esc(w.e)}</div><button class="btn" style="margin-top:12px" data-a="qask" data-k="${k}">${ico('spark',16)} Explain more with AI</button></div>`).join('')}`:`<div class="empty"><b>Perfect score!</b>You got every question right.</div>`}
    <button class="btn wide" style="margin-top:8px" data-a="qmore">${ico('spark',16)} Ask AI for 5 more ${esc(QZ.ex)} questions</button></div>`;
  }
  const subs=qSubs(),avail=qPool().length,hist=(S.quiz||[]).slice(-3).reverse();
  return `<div class="wrap"><h1>Quiz</h1><p class="sub">Practise past-question style questions. Every wrong answer comes with an explanation.</p>
  <div class="card" style="margin-bottom:16px"><h2>Choose exam</h2><div class="chips">${Object.keys(EX).map(e=>`<button class="chip ${QZ.ex===e?'on':''}" data-a="qex" data-v="${e}">${e}</button>`).join('')}</div><p class="mut" style="margin:10px 0 0;font-size:13px">${EXD[QZ.ex]}</p></div>
  <div class="card" style="margin-bottom:16px"><h2>Subject</h2><div class="chips"><button class="chip ${QZ.sub==='All'?'on':''}" data-a="qsub" data-v="All">All subjects</button>${subs.map(s=>`<button class="chip ${QZ.sub===s?'on':''}" data-a="qsub" data-v="${esc(s)}">${esc(s)}</button>`).join('')}</div></div>
  <div class="card" style="margin-bottom:18px"><h2>Number of questions</h2><div class="chips">${[5,10,20].map(n=>`<button class="chip ${QZ.n===n?'on':''}" data-a="qcount" data-v="${n}">${n}</button>`).join('')}</div><p class="mut" style="margin:10px 0 0;font-size:13px">${avail} questions available for this choice${avail<QZ.n?'. The quiz will use all of them.':'.'}</p></div>
  <button class="btn pri lg wide" data-a="qstart" ${avail?'':'disabled'}>Start quiz</button>
  ${hist.length?`<h2 class="mut" style="margin-top:28px;font-size:14px">RECENT RESULTS</h2><div class="list">${hist.map(h=>`<div class="li"><div class="rb"><b>${esc(h.ex)} · ${esc(h.sub)}</b><small>${fmtD(h.ts)}</small></div><span class="pill ${h.s/h.n>=.6?'ok':'bd'}">${h.s}/${h.n}</span></div>`).join('')}</div>`:''}</div>`;
}

document.addEventListener('change',e=>{
  if(!S)return;const t=e.target,s=S.settings;
  if(t.id==='sname'){S.name=t.value.trim();save();renderSide()}
  else if(t.id==='sprov'){s.provider=t.value;save()}
  else if(t.id==='skey'){s.geminiKey=t.value.trim();save();toast('Key saved on this device')}
  else if(t.id==='smod'){s.geminiModel=t.value.trim()||'gemini-flash-latest';save()}
  else if(t.id==='sfoc'){s.focus=Math.min(180,Math.max(1,+t.value||25));save();if(!TM.run&&TM.mode==='focus')TM.rem=tmTotal()}
  else if(t.id==='sbrk'){s.brk=Math.min(60,Math.max(1,+t.value||5));save();if(!TM.run&&TM.mode==='brk')TM.rem=tmTotal()}
  else if(t.id==='ifile'){
    const f=t.files[0];t.value='';if(!f)return;
    const fr=new FileReader();fr.onload=async()=>{try{const o=JSON.parse(fr.result);if(o.app!=='StudentHub'||!o.data)throw 0;if(!(await ask('Restoring replaces what is in StudentHub now. Continue?','Restore')))return;S=norm(o.data);save();render();toast('Backup restored')}catch(_){toast('That is not a StudentHub backup file.')}};fr.readAsText(f);
  }
});
